; 7WAMP PURE - configuracao ativa da distribuicao de testes.
; Inventario: Data/modules.json. Nomes abaixo correspondem as pastas verificadas.
; Nao altere ActiveVersion sem instalar a pasta correspondente.

[General]
Language=pt-BR
AutoStart=false

[apache]
Enabled=true
ActiveVersion=2.4.6
Port=80

[mysql]
Enabled=true
ActiveVersion=mysql
Port=3306

[mariadb]
Enabled=false
Port=3306

[php]
Enabled=true
ActiveVersion=php

[redis]
Enabled=false
ActiveVersion=redis
Port=6379

[nodejs]
Enabled=false

[nginx]
Enabled=false
Port=8080
